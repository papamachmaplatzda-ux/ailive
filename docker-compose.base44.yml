# Base44 development stack for the Berlin open-world 2D RPG.
# Runs the Vite dev server from the cloned source (never a prebuilt image) so
# every edit shows up in the preview without a rebuild.
services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: "Berlin Open World RPG"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Platform flag — read as a bare passthrough, never hardcoded.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      # Vite >= 6.1 appends this to server.allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - DISABLE_HMR=false
    # Install deps from the mounted checkout (no lockfile in this repo), then run
    # the live-reload dev server. --no-package-lock keeps the checkout clean.
    command:
      - sh
      - -ec
      # --legacy-peer-deps: the repo pins esbuild ^0.25 while vite 8 wants ^0.27/^0.28.
      - CI=true npm install --no-audit --no-fund --no-package-lock --legacy-peer-deps && exec npx vite --host 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 150s
    restart: on-failure

volumes:
  node_modules:
